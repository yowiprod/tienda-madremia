<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIMA — Sudadera Manta</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
</head>
<body class="page-home">

  <!-- HEADER -->
  <header class="site-header" id="site-header">
    <div class="site-header__bar">
      <div class="site-header__side site-header__side--start">
        <span class="site-header__tag">ES</span>
      </div>
      <div class="site-header__center">
        <a href="/" class="site-header__logo">
          <span class="site-header__logo-icon">✦</span>
          <span>ZIMA</span>
        </a>
      </div>
      <div class="site-header__side site-header__side--end">
        <a href="producto.html" class="site-header__menu">VER PRODUCTO <span class="site-header__dot">●</span></a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="hero">
  <div class="hero__sticky">

    <!-- Texto gigante detrás -->
    <div class="hero__text-layer" aria-hidden="true">
      <h1 class="hero__title">
        <span class="hero__line hero__line--1">BATA</span>
        <span class="hero__line hero__line--2">MANTA</span>
      </h1>
    </div>

    <!-- Visor 3D Three.js -->
    <div class="hero__product" id="heroProduct">
      <canvas id="zimaCanvas"></canvas>
      <div class="spin-hint" id="spinHint" aria-hidden="true">
        <span class="spin-hint__text">Arrastra para girar</span>
      </div>
      <span class="hero__product-cta" id="productCta" aria-hidden="true">Ver producto</span>
    </div>

    <!-- Meta esquinas -->
    <div class="hero__meta" aria-hidden="true">
      <div class="hero__meta-left">
        <span>Sudadera</span>
        <span>Manta</span>
      </div>
      <div class="hero__meta-right">
        <span>Talla Única</span>
        <span>España</span>
      </div>
    </div>

    <!-- Scroll hint — desaparece al scrollear -->
    <div class="hero__scroll-hint" id="heroScrollHint" aria-hidden="true">
      <span class="hero__scroll-hint__line"></span>
      <span class="hero__scroll-hint__label">Desliza</span>
    </div>

  </div><!-- /.hero__sticky -->
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const container = document.getElementById('heroProduct');
    const canvas    = document.getElementById('zimaCanvas');
    const W = container.offsetWidth;
    const H = container.offsetHeight;

    // --- Renderer ---
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // --- Scene ---
    const scene = new THREE.Scene();
    scene.background = null;

    // Environment IBL (iluminación indirecta de estudio)
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    pmremGenerator.dispose();

    // --- Camera ---
    const camera = new THREE.PerspectiveCamera(32, W / H, 0.01, 100);
    camera.position.set(0, 0.05, 3.8);

    // --- Iluminación de estudio 3 puntos ---
    // Luz clave (key light) — frontal derecha arriba, cálida
    const keyLight = new THREE.DirectionalLight(0xfff5e0, 3.5);
    keyLight.position.set(1.5, 2.5, 2.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.001;
    scene.add(keyLight);

    // Luz de relleno (fill light)
    const fillLight = new THREE.DirectionalLight(0xddeeff, 1.5);
    fillLight.position.set(-2, 0.5, 1.5);
    scene.add(fillLight);

    // Luz de borde (rim light)
    const rimLight = new THREE.DirectionalLight(0xccddff, 2.0);
    rimLight.position.set(-0.5, 3, -2);
    scene.add(rimLight);

    // Ambiente
    const ambientLight = new THREE.AmbientLight(0xfff8f0, 0.5);
    scene.add(ambientLight);

    // --- Controls ---
    const controls = new OrbitControls(camera, canvas);
    controls.enablePan = false;
    controls.enableZoom = false;
    controls.minPolarAngle = Math.PI * 0.25;
    controls.maxPolarAngle = Math.PI * 0.75;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.dampingFactor = 0.08;
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    controls.autoRotate = false; // arranca desactivado — se activa al terminar el reveal

    // Click vs drag: si el puntero se mueve < 8px es click → ir a producto
    let ptrDownX = 0, ptrDownY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      controls.autoRotate = false;
      ptrDownX = e.clientX;
      ptrDownY = e.clientY;
    });
    canvas.addEventListener('pointerup', (e) => {
      if (!revealDone) return;
      const dx = e.clientX - ptrDownX;
      const dy = e.clientY - ptrDownY;
      if (Math.sqrt(dx * dx + dy * dy) < 8) {
        window.location.href = 'producto.html';
      }
    });

    // --- Material de tela navy PBR ---
    const navyMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(0x1e4fa0),
      roughness: 0.88,
      metalness: 0.0,
      envMapIntensity: 1.2,
    });

    // --- Cargar GLB ---
    let zimaModel = null;

    const loader = new GLTFLoader();
    loader.load('3d/zima_front.glb', (gltf) => {
      const model = gltf.scene;
      zimaModel = model;

      // Centrar y escalar modelo
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale  = 1.55 / maxDim;

      model.position.sub(center.multiplyScalar(scale));
      model.scale.setScalar(scale);

      // Conservar textura original del GLB, solo cambiar color
      model.traverse(child => {
        if (child.isMesh) {
          const mat = child.material;
          mat.color.set(0x0d2456);
          mat.roughness = 0.88;
          mat.metalness = 0.0;
          mat.envMapIntensity = 1.2;
          mat.needsUpdate = true;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(model);

      // Mostrar hint
      setTimeout(() => {
        const hint = document.getElementById('spinHint');
        if (hint) hint.classList.add('is-visible');
      }, 1800);
    });

    // --- Scroll reveal ---
    const heroEl        = document.getElementById('hero');
    const heroProduct   = document.getElementById('heroProduct');
    const scrollHint    = document.getElementById('heroScrollHint');
    let revealDone      = false;
    let scrollHintHidden = false;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function onScroll() {
      const scrollRange = heroEl.offsetHeight - window.innerHeight;
      const progress    = Math.max(0, Math.min(1, window.scrollY / scrollRange));
      const eased       = easeOutCubic(progress);

      // Ocultar DESLIZA al primer scroll
      if (progress > 0.02 && !scrollHintHidden) {
        scrollHintHidden = true;
        if (scrollHint) scrollHint.classList.add('is-hidden');
      }

      // CSS: sube desde abajo (78% → 0%)
      heroProduct.style.transform = `translateY(${(1 - eased) * 78}%)`;

      // 3D: 2 vueltas completas en el primer 85% del scroll
      const rotProgress = Math.min(1, progress / 0.85);
      const rotEased    = easeOutCubic(rotProgress);
      if (zimaModel) {
        zimaModel.rotation.y = rotEased * Math.PI * 2 * 2;
      }

      if (progress >= 0.85 && !revealDone) {
        revealDone = true;
        if (zimaModel) zimaModel.rotation.y = 0;
        controls.reset();
        canvas.classList.add('is-revealed');
        heroProduct.classList.add('is-settling');
        heroProduct.style.transform = 'translateY(0)';
        setTimeout(() => { controls.autoRotate = true; }, 600);
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // estado inicial

    // --- Render loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- Resize ---
    window.addEventListener('resize', () => {
      const w = container.offsetWidth;
      const h = container.offsetHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  </script>

  <script src="js/main.js"></script>
</body>
</html>
